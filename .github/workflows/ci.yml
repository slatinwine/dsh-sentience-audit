name: CI

# The engine makes three platform-dependent decisions (path case, shell tool
# names, read-back probe verbs). They can only be trusted if they are exercised
# on all three platforms, so this matrix is the evidence for the cross-platform
# claim in the README rather than a formality.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs the engine suites, then builds and runs the contract and
      # discrimination suites against the built `lib/`.
      - name: Test
        run: npm test

      # A bundle that packs without its patch file, or without built output,
      # installs and then contributes nothing. Assert the artifact instead of
      # trusting the manifest: this packs for real, reads the tarball's own file
      # list, and checks the patch row names the package.
      - name: Verify the published artifact
        run: npm run verify:pack

      # Proves the package installs and answers from a plain Node process —
      # the same path a consumer takes.
      - name: Install and use the packed artifact
        shell: bash
        run: |
          npm pack --silent --cache "$PWD/.npm-cache" > /dev/null
          TGZ=$(ls -1 *.tgz | head -n 1)
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cache" "$GITHUB_WORKSPACE/$TGZ"
          node -e "
            const { assess, RUBRIC } = require('@yourorg/dsh-sentience-audit')
            const result = assess({ sessionId: 'smoke', events: [] })
            if (RUBRIC.length !== 14) throw new Error('rubric size changed')
            if (result.level !== 1) throw new Error('empty session should be L1')
            console.log('consumer smoke ok: L' + result.level + ', ' + result.indicators.length + ' indicators')
          "
